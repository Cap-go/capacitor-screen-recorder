# Library plugin manifests must not force host-app network policy.
# Excluding this file avoids xml:S5332 without declaring usesCleartextTraffic,
# which would break Android manifest merger with plugins that need cleartext.
sonar.exclusions=android/src/main/AndroidManifest.xml

# Workflow actions are pinned to latest major tags (repository policy), not commit SHAs.
sonar.issue.ignore.multicriteria=gha_major_tags
sonar.issue.ignore.multicriteria.gha_major_tags.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha_major_tags.resourceKey=**/.github/workflows/**
